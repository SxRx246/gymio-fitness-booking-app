spring.application.name=api-gateway

# Gateway port
server.port=${PORT:8080}

# User Service routing
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Notification Service routing
spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notifications/**

# Fitness & Booking Service routing
spring.cloud.gateway.server.webflux.routes[2].id=fitness-booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=${FITNESS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/fitness-classes/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Internal User Service authentication endpoint
app.user-service.validation-url=${USER_SERVICE_VALIDATION_URL:http://localhost:8081/internal/auth/validate}

# Shared secret for Gateway-to-User-Service communication
app.internal-auth.secret=${INTERNAL_AUTH_SECRET}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs

# Enable API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true