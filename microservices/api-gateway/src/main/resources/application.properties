spring.application.name=api-gateway

# Gateway port
server.port=${PORT:8080}

# User Service routing
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Notification Service routing
spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notifications/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized