spring.application.name=api-gateway

# Gateway port
server.port=${PORT:8080}

# Active profile (local by default)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Shared secret for Gateway-to-microservices communication
app.internal-auth.secret=${INTERNAL_AUTH_SECRET}

# User Service endpoint used to validate JWTs (overridden per profile)
app.user-service.validation-url=${USER_SERVICE_VALIDATION_URL:http://localhost:8081/internal/auth/validate}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
