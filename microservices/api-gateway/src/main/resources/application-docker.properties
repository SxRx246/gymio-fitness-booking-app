# Docker profile: service URLs are supplied as environment variables by the
# container definition (Dockerrun.aws.json) so the same image can run in
# docker-compose and on Elastic Beanstalk.

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/profile/**,/admin/users/**

# Fitness & Booking Service
spring.cloud.gateway.server.webflux.routes[1].id=fitness-booking-service
spring.cloud.gateway.server.webflux.routes[1].uri=${FITNESS_SERVICE_URL:http://fitness-booking-service:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/fitness-classes/**,/bookings/**,/api/waitlist/**,/class-reviews/**

# Membership & Payment Service
spring.cloud.gateway.server.webflux.routes[2].id=membership-payment-service
spring.cloud.gateway.server.webflux.routes[2].uri=${MEMBERSHIP_PAYMENT_SERVICE_URL:http://membership-payment-service:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/coupons/**,/payments/**,/membership-plans/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notifications/**

# User Service validation endpoint
app.user-service.validation-url=${USER_SERVICE_VALIDATION_URL:http://user-service:8081/internal/auth/validate}