# Use an in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:user_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate test configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test authentication configuration
jwt-secret=test-jwt-secret-for-user-service
jwt-expiration-ms=86400000
internal.auth.secret=test-internal-secret

# Prevent Kafka listeners from starting during tests
spring.kafka.listener.auto-startup=false