spring.application.name=fitness-booking-service

# Server
server.port=${PORT:8082}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gymio}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=fitness-booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ga.*

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

app.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}
app.internal-auth.secret=${INTERNAL_AUTH_SECRET}


# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs

# Enable API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true