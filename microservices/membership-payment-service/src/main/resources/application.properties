spring.application.name=membership-payment-service

# Server
server.port=${MEMBERSHIP_PAYMENT_SERVICE_PORT:8083}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gymio}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Internal Authentication
app.internal-auth.secret=${INTERNAL_AUTH_SECRET}


# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs

# Enable API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true