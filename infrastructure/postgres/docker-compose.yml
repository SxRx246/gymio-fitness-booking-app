services:
  postgres:
    image: postgres:18.6
    container_name: gymio-postgres
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: gymio
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - gymio_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gymio_postgres_data:
