services:
  postgres:
    image: postgres:18.6
    container_name: gymio-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: gymio
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gymio_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymio-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: gymio-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - gymio-network

  user-service:
    build:
      context: ./microservices/user-service
      dockerfile: Dockerfile
    image: gymio-user-service:latest
    container_name: gymio-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gymio
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymio-network

  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile
    image: gymio-notification-service:latest
    container_name: gymio-notification-service
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    environment:
      PORT: 8084
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gymio-network

  fitness-booking-service:
    build:
      context: ./microservices/fitness-booking-service
      dockerfile: Dockerfile
    image: gymio-fitness-booking-service:latest
    container_name: gymio-fitness-booking-service
    restart: unless-stopped
    ports:
      - "${FITNESS_SERVICE_PORT:-8082}:8082"
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/gymio
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymio-network

volumes:
  gymio_postgres_data:
    external: true
    name: postgres_gymio_postgres_data

  kafka_data:
    external: true
    name: kafka_kafka_data

networks:
  gymio-network:
    driver: bridge
